name: Nyanbin release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack CLI
        run: mkdir -p "$RUNNER_TEMP/release" && pnpm --filter nyanbin pack --pack-destination "$RUNNER_TEMP/release"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyanbin-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.CONTAINER_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Create GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com' }}
        uses: softprops/action-gh-release@v2
        with:
          name: Nyanbin ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ runner.temp }}/release/*.tgz
      - name: Verify public CLI release asset
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/nyanbin-${version}.tgz"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 --output "$RUNNER_TEMP/public-nyanbin.tgz" "$asset"
          npm install --global "$RUNNER_TEMP/public-nyanbin.tgz" --ignore-scripts
          test "$(nyanbin --version)" = "$version"
