name: Nyanbin release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'git.oh.rip' }}
  IMAGE_NAME: ${{ vars.CONTAINER_REGISTRY || 'git.oh.rip' }}/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack CLI
        run: mkdir -p "$RUNNER_TEMP/release" && pnpm --filter nyanbin pack --pack-destination "$RUNNER_TEMP/release"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyanbin-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
      - name: Publish CLI to npm
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/release/*.tgz --access public --ignore-scripts
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Create Forgejo release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          direction: upload
          release-dir: ${{ runner.temp }}/release
          token: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          release-notes: Nyanbin ${{ github.ref_name }}
