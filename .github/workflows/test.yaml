name: Nyanbin CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/backend
      - run: pnpm install --frozen-lockfile
      - name: Generated dependency inventory is current
        run: pnpm licenses:generate && git diff --exit-code -- DEPENDENCY_LICENSES.csv
      - name: OpenAPI spec is valid
        run: npx --yes @redocly/cli@2.4.0 lint docs/api/openapi.yaml
      - name: Generated OpenAPI JSON is current
        run: pnpm run openapi:generate && git diff --exit-code -- packages/backend/openapi.json
      - name: Type and package checks
        run: pnpm run check
      - name: CLI protocol unit tests
        run: pnpm --filter nyanbin test
      - name: Rust format
        run: cargo fmt --manifest-path packages/backend/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path packages/backend/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path packages/backend/Cargo.toml --locked
      - name: Production build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Shared protocol and API unit contracts
        run: pnpm --filter nyanbin test
      - run: pnpm exec playwright install --with-deps
      - name: Browser and CLI interoperability tests
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
