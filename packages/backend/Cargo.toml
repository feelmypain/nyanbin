[package]
name = "nyanbin"
version = "1.1.1"
authors = ["cupcakearmy <hi@nicco.io>", "Nyanbin contributors"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[[bin]]
name = "nyanbin"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
ipnet = "2"
redis = { version = "1", features = ["aio", "connection-manager", "tokio-native-tls-comp"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["compression-full", "fs"] }
